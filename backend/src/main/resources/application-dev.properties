# Self-contained development profile.
# Run from the repository root with:
# mvn -f backend/pom.xml spring-boot:run -Dspring-boot.run.profiles=dev

spring.datasource.url=jdbc:h2:file:./h2db/carbontrack-dev;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# The existing Flyway migrations target MySQL. Let Hibernate manage the local
# H2 schema so development does not require a MySQL server.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Use Spring's in-memory cache so local development does not require Redis.
spring.cache.type=simple
spring.data.redis.repositories.enabled=false

server.port=8080

# JWT Configuration
jwt.secret=${JWT_SECRET:this-is-a-dev-placeholder-secret-replace-in-production-with-256-bit-key}
jwt.expiration=86400000

# Google OAuth 2.0 Configuration (Optional for dev - can be disabled)
# Non-empty development fallbacks keep Spring's optional OAuth client
# auto-configuration from aborting startup. Browser-based Google Identity
# uses VITE_GOOGLE_CLIENT_ID; set these environment variables only when the
# server-side OAuth authorization-code flow is enabled.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:development-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:development-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.provider.google.user-name-attribute=sub
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com

# Mail Configuration (Optional for dev)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Gemini Configuration (Optional for dev)
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent

# Optional first-admin bootstrap. Values must be supplied through environment
# variables and are intentionally never stored in source control.
carbontrack.bootstrap.admin-email=${CARBONTRACK_ADMIN_EMAIL:admin@demo.carbontrack.local}
carbontrack.bootstrap.admin-password=${CARBONTRACK_ADMIN_PASSWORD:AdminPassword123!}
carbontrack.demo.enabled=${CARBONTRACK_DEMO_ENABLED:true}
carbontrack.demo.password=${CARBONTRACK_DEMO_PASSWORD:Password@123}
