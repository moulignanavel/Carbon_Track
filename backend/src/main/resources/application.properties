# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/carbontrack
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Swathi@1029

# Flyway Migration Settings - ENABLED
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secret=this-is-a-placeholder-secret-replace-with-a-real-256-bit-random-string
jwt.expiration=86400000

# Jackson — serialize dates as ISO strings, not arrays
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd

# Google OAuth 2.0 Configuration
# Use environment variables for credentials in production
# For development: set via environment variables or create application-local.properties
spring.config.import=optional:file:./application-secret.properties
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-client-id-here}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-client-secret-here}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# OAuth2 Login Configuration
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=swathi29rd@gmail.com
spring.mail.password=iggizhrdkpoqiycq
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Gemini Configuration
gemini.api.key=${GEMINI_API_KEY}
