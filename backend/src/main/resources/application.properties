# H2 In-Memory Database (for testing without MySQL)
spring.datasource.url=jdbc:h2:mem:carbontrack
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway Migration Settings - DISABLED
spring.flyway.enabled=false

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console (optional - for debugging)
spring.h2.console.enabled=true

# JWT Configuration
jwt.secret=this-is-a-placeholder-secret-replace-with-a-real-256-bit-random-string
jwt.expiration=86400000

